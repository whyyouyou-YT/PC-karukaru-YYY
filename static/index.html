<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>PC-karukaru-YYY</title>
<style>
  :root {
    --bg: #16171a;
    --panel: #1e2024;
    --panel-hover: #24272c;
    --line: #2e3238;
    --text: #e6e8ea;
    --muted: #8b9096;
    --accent: #4c9aff;
    --safe: #3fb27f;
    --caution: #e0a458;
    --danger: #e0575b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: "Yu Gothic UI", "Segoe UI", "Meiryo", sans-serif;
    font-size: 14px;
    user-select: none;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }

  header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--line);
    flex: none;
  }
  .top-row { display: flex; align-items: baseline; gap: 12px; }
  h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  .admin-tag {
    font-size: 11px; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 3px;
    padding: 1px 6px;
  }
  .spacer { flex: 1; }
  button {
    font-family: inherit; font-size: 13px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 5px;
    padding: 6px 14px; cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--panel-hover); border-color: #414650; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary {
    background: var(--accent); border-color: var(--accent); color: #0b1220; font-weight: 600;
  }
  button.primary:hover:not(:disabled) { background: #5ba6ff; }
  button.link {
    background: none; border: none; color: var(--muted);
    padding: 2px 4px; font-size: 12px; text-decoration: underline;
  }
  button.link:hover { color: var(--text); background: none; }

  .disk { margin-top: 12px; }
  .disk-labels {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--muted); margin-bottom: 5px;
  }
  .disk-bar {
    height: 6px; background: #2a2d33; border-radius: 3px; overflow: hidden;
    display: flex;
  }
  .disk-used { background: #4a5058; height: 100%; transition: width .4s ease; }
  .disk-gain { background: var(--safe); height: 100%; transition: width .4s ease; }

  main { flex: 1; overflow-y: auto; padding: 8px 12px 4px; }
  main::-webkit-scrollbar { width: 10px; }
  main::-webkit-scrollbar-thumb { background: #33373d; border-radius: 5px; }

  .group-label {
    font-size: 11px; color: var(--muted); letter-spacing: .08em;
    padding: 12px 8px 6px; text-transform: uppercase;
  }

  .row {
    background: var(--panel); border: 1px solid transparent;
    border-radius: 7px; margin-bottom: 5px;
  }
  .row:hover { background: var(--panel-hover); }
  .row.open { border-color: var(--line); }
  .row-main {
    display: flex; align-items: center; gap: 11px;
    padding: 11px 13px; cursor: pointer;
  }
  input[type=checkbox] {
    width: 16px; height: 16px; accent-color: var(--accent);
    cursor: pointer; flex: none; margin: 0;
  }
  .label { font-size: 14px; }
  .badge {
    font-size: 10px; padding: 1px 6px; border-radius: 3px;
    border: 1px solid currentColor; flex: none;
  }
  .badge.caution { color: var(--caution); }
  .badge.admin { color: var(--muted); }
  .badge.trash { color: var(--safe); }
  .badge.running { color: var(--danger); }
  .size {
    font-variant-numeric: tabular-nums; font-size: 14px;
    min-width: 82px; text-align: right; color: var(--text);
  }
  .size.zero { color: var(--muted); }
  .size.pending { color: var(--muted); }
  .caret { color: var(--muted); font-size: 11px; width: 12px; text-align: center; }

  .detail {
    display: none; padding: 2px 14px 14px 40px;
    font-size: 12.5px; color: var(--muted); line-height: 1.65;
  }
  .row.open .detail { display: block; }
  .detail .note { margin-bottom: 9px; }
  .detail .warn { color: var(--caution); }
  .paths { border-top: 1px solid var(--line); padding-top: 8px; }
  .path-line {
    display: flex; gap: 10px; padding: 2px 0;
    font-family: "Consolas", monospace; font-size: 11.5px;
  }
  .path-line .p {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: #a7adb4; cursor: pointer;
  }
  .path-line .p:hover { color: var(--accent); text-decoration: underline; }
  .path-line .s { font-variant-numeric: tabular-nums; color: var(--muted); }
  .path-line .d { color: #6a7078; min-width: 74px; }
  .more { padding-top: 4px; font-size: 11.5px; }

  footer {
    flex: none; border-top: 1px solid var(--line);
    padding: 13px 20px; display: flex; align-items: center; gap: 16px;
    background: #191b1f;
  }
  .total { font-size: 13px; color: var(--muted); }
  .total b { color: var(--text); font-size: 17px; font-variant-numeric: tabular-nums; }
  .status { font-size: 12.5px; color: var(--muted); }
  .status.done { color: var(--safe); }
  .status.error { color: var(--danger); }

  .confirm {
    display: none; position: absolute; inset: 0;
    background: rgba(10,11,13,.78); align-items: center; justify-content: center;
    backdrop-filter: blur(2px);
  }
  .confirm.show { display: flex; }
  .confirm-box {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 22px 24px; width: 460px; max-height: 80%; overflow-y: auto;
  }
  .confirm-box h2 { font-size: 15px; margin: 0 0 12px; }
  .confirm-list { font-size: 13px; line-height: 1.9; margin: 0 0 14px; padding-left: 18px; color: #c8ccd0; }
  .confirm-list .s { color: var(--muted); font-variant-numeric: tabular-nums; }
  .confirm-note { font-size: 12px; color: var(--caution); margin-bottom: 16px; line-height: 1.6; }
  .confirm-actions { display: flex; gap: 10px; justify-content: flex-end; }
</style>
</head>
<body>

<header>
  <div class="top-row">
    <h1>PC-karukaru-YYY</h1>
    <span class="admin-tag" id="adminTag" style="display:none">管理者</span>
    <button class="link" id="btnAdmin" style="display:none">管理者権限で開き直す</button>
    <div class="spacer"></div>
    <button id="btnSelectAvailable">起動中以外を選択</button>
    <button id="btnRescan">再スキャン</button>
  </div>
  <div class="disk">
    <div class="disk-labels">
      <span id="diskText">ディスク容量を確認中…</span>
      <span id="scanTime"></span>
    </div>
    <div class="disk-bar">
      <div class="disk-used" id="diskUsed" style="width:0%"></div>
      <div class="disk-gain" id="diskGain" style="width:0%"></div>
    </div>
  </div>
</header>

<main id="list"></main>

<footer>
  <div class="total">選択中 <b id="totalSize">—</b></div>
  <div class="status" id="status">スキャン中…</div>
  <div class="spacer"></div>
  <button class="primary" id="btnClean" disabled>選択項目を削除</button>
</footer>

<div class="confirm" id="confirm">
  <div class="confirm-box">
    <h2>以下を削除します</h2>
    <ul class="confirm-list" id="confirmList"></ul>
    <div class="confirm-note" id="confirmNote"></div>
    <div class="confirm-actions">
      <button id="btnCancel">キャンセル</button>
      <button class="primary" id="btnConfirm">削除する</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
